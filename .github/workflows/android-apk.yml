# Builds a debug APK on every push (and on demand from the Actions tab).
# Download it from the run page → Artifacts → cinematch-debug-apk.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (preinstalled on the runner)
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Signing key (optional secret)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/cinematch.keystore"
            echo "CM_KEYSTORE_FILE=$RUNNER_TEMP/cinematch.keystore" >> "$GITHUB_ENV"
            echo "Using the CineMatch signing key"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - APK signed with a throwaway debug key (Google sign-in won't work)"
          fi

      - run: cd android && ./gradlew assembleDebug --no-daemon
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CM_VERSION_CODE: ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: cinematch-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Publish the APK as a GitHub Release so it has a direct download link:
      # https://github.com/<owner>/<repo>/releases/latest/download/cinematch.apk
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cinematch.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CineMatch build ${{ github.run_number }}
          body: Debug APK built from ${{ github.sha }}. Download cinematch.apk below and open it on your Android phone.
          make_latest: true
          files: cinematch.apk
